# KAGE-MAN.DOJO :: KAGE-MAN.DOJO (the all-belts machine — the whole dojo, one host)
# One continuous campaign across three segments:
#   Kali (WAN) -> foothold (WAN+DMZ) -> seam (DMZ+INTERNAL) -> deep + persistence (INTERNAL)
# Only the DMZ carries the default route; INTERNAL and WAN are segment-local,
# which is what forces the campaign to be pivoted rather than routed.
#
# columns: key       iface   docker-network    subnet           gateway        host-ip             default-route
dmz       enp0s3 KAGE-DOJO-DMZ 192.168.80.0/24  192.168.80.1  192.168.80.250/24  yes
internal  enp0s8 KAGE-DOJO-INT 172.16.80.0/24   172.16.80.1   172.16.80.250/24   no
wan       enp0s9 KAGE-DOJO-WAN 10.0.8.0/24      10.0.8.1      10.0.8.250/24      no
